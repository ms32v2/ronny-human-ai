<!DOCTYPE html>
<html>
<head>

<title>Ronny Control Panel</title>

<link rel="stylesheet" href="style.css">

<script src="/socket.io/socket.io.js"></script>

</head>
<body>

<div class="container">

<h1>Ronny AI Bot Console</h1>

<div class="controls">

<button onclick="toggleRoast()">Toggle Roast Mode</button>

<button onclick="toggleManual()">Manual Control</button>

</div>

<div id="chat" class="chat"></div>

<input id="msg" placeholder="Send message">

<button onclick="send()">Send</button>

</div>

<script src="app.js"></script>

</body>
</html>
